<style>
.pc{--c:#6ab43e;--bg:#f2f8ec;--f:#fff;background:var(--bg);border-radius:20px;padding:12px;text-align:center;transition:background .4s}
.pc[data-k=sed]{--c:#2f80ed;--bg:#eef3fb}.pc[data-k=enc]{--c:#1ea0e3;--bg:#e9f5fc}.pc[data-k=poca]{--c:#4d5672;--bg:#edeef3}
.pc[data-k=mucha]{--c:#f4b400;--bg:#fdf5e3;--f:#4a3700}.pc[data-k=estr]{--c:#f5862a;--bg:#fdf0e6}.pc[data-k=off]{--c:#7a7d85;--bg:#eceef1}
.bd{display:inline-block;background:var(--c);color:var(--f);font:700 17px/1 sans-serif;padding:8px 18px;border-radius:99px}
.av{stroke-linecap:round;stroke-linejoin:round;display:block;width:100%;max-width:230px;margin:auto;--t:1;--k:1;overflow:visible}
.av[data-pers="0"]{--t:.7;--k:1.6}.av[data-pers="1"]{--t:1.8;--k:.5}
.av[data-c=off]{filter:grayscale(1) opacity(.8)}
.sh{opacity:.08}.pd,.wt{fill:#5cc1f0;opacity:.75}.pt{fill:#d9773a}.rm{fill:#e5884a}.so{fill:#5b3a24}
.st{stroke:#4c8f2a;stroke-width:5;fill:none}.lf{fill:#6bb33c;stroke:#4c8f2a;stroke-width:2}
.fc{fill:#2b1d16}.hl{fill:#fff}.tg,.tq{fill:#f06c7a}.ck{fill:#f2766b;opacity:.45}.ld{fill:#d9773a;stroke:#2b1d16;stroke-width:3}
.tr,.dr,.sw{fill:#4fb3ec}.cl{fill:#4a5470}.su{fill:#f9c513}.ry{stroke:#f9b400;stroke-width:4}
.zz{font:800 16px sans-serif;fill:#555}.hap,.sk{fill:none;stroke-width:3.5}.hap{stroke:#f5c000}.sk{stroke:#999}
.bw,.bf,.eh,.ez,.ex,.mw,.mf,.mk{fill:none;stroke:#2b1d16;stroke-width:3.4}
.bw,.bf,.eo,.ld,.eh,.ez,.ex,.ck,.mo,.ms,.tq,.mw,.mf,.mk,.mz,.tr,.sw,.cl,.su,.dr,.zz,.sk,.hap,.wt,.pd{display:none}
[data-c=sed] :is(.bw,.eo,.mo,.tr),[data-c=enc] :is(.bw,.ex,.mk,.ck),[data-c=poca] :is(.bf,.eo,.ld,.mf),
[data-c=mucha] :is(.bw,.ex,.mo,.ck,.sw),[data-c=feliz] :is(.eh,.ms,.ck,.hap),[data-c=estr] :is(.bw,.eo,.mw,.sk),
[data-c=off] :is(.ez,.mz,.zz),[data-luz=poca] .cl,[data-luz=mucha] .su,
[data-agua=enc] :is(.wt,.pd,.dr),[data-c=feliz][data-pers="2"] .tq{display:inline}
[data-c=off] :is(.cl,.su,.wt,.pd,.dr){display:none}[data-c=mucha] .ck{fill:#f0442c;opacity:.55}
.lf,.pl,.bo,.ry{transform-box:view-box;transition:transform .6s}.lf{transform-origin:100px 64px}.pl{transform-origin:100px 96px}.bo{transform-origin:100px 184px}.ry{transform-origin:165px 12px}
.e1,.e2,.ck ellipse,.mo,.dr use,.sw use,.tr,.zz text{transform-box:fill-box;transform-origin:center}
[data-c=sed] .l{transform:rotate(calc(-30deg - var(--k)*8deg))}[data-c=sed] .r{transform:rotate(calc(30deg + var(--k)*8deg))}[data-c=sed] .b{transform:rotate(-25deg)}
[data-luz=poca]:not([data-c=sed]) .l{transform:rotate(-18deg)}[data-luz=poca]:not([data-c=sed]) .r{transform:rotate(18deg)}
[data-c=off] .l{transform:rotate(-14deg)}[data-c=off] .r{transform:rotate(14deg)}
[data-c=feliz] .l{transform:rotate(10deg)}[data-c=feliz] .r{transform:rotate(-10deg)}
.e1,.e2{animation:bl calc(var(--t)*4s) infinite}[data-pers="2"] .e1{animation:none}
[data-c=feliz] .pl{animation:sw calc(var(--t)*2.4s) ease infinite}
[data-c=feliz] .bo{animation:hop calc(var(--t)*1.4s) ease infinite}
[data-c=feliz] .hap,[data-c=estr] .sk{animation:fl calc(var(--t)*1s) infinite}
[data-c=estr] .bo{animation:sh calc(var(--t)*.3s) linear infinite}
[data-c=sed] .mo{animation:pa calc(var(--t)*.8s) ease infinite}
[data-c=sed] .tr,.sw use,.dr use{animation:fa calc(var(--t)*1.6s) ease-in infinite}
.dr use:nth-child(2n),.sw use+use{animation-delay:-.8s}
[data-c=enc] .ck ellipse{animation:pu calc(var(--t)*1.2s) ease infinite}
.ry{animation:spin calc(var(--t)*9s) linear infinite}.cl{animation:dr calc(var(--t)*4s) ease infinite}
[data-c=off] .bo{animation:br 4s ease infinite}.zz text{animation:zz 3s linear infinite}.zz text+text{animation-delay:-1s}.zz text+text+text{animation-delay:-2s}
@keyframes bl{0%,92%,100%{transform:none}96%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:rotate(calc(var(--k)*-4deg))}50%{transform:rotate(calc(var(--k)*4deg))}}
@keyframes hop{50%{transform:translateY(calc(var(--k)*-4px))}}
@keyframes sh{25%{transform:translateX(calc(var(--k)*-1.6px))}75%{transform:translateX(calc(var(--k)*1.6px))}}
@keyframes fl{50%{opacity:.25}}
@keyframes pa{50%{transform:scale(1,calc(1 - var(--k)*.18))}}
@keyframes fa{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(calc(var(--k)*14px));opacity:0}}
@keyframes pu{50%{transform:scale(calc(1 + var(--k)*.22))}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes dr{50%{transform:translateX(calc(var(--k)*6px))}}
@keyframes br{50%{transform:scaleY(.97)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-10px)}}
@media (prefers-reduced-motion:reduce){.av *{animation:none!important;transition:none!important}}
</style>

<script>
function setAvatar(e,p,o,a){a=a||document.getElementById('av');var c=a.parentNode,d=a.dataset,g='ok',l='ok',k='feliz',t,
N={sed:'Sed',enc:'Encharcada',poca:'Poca luz',mucha:'Mucha luz',feliz:'Feliz',estr:'Estresada',off:'Sin conexión'};
[].concat(e).forEach(function(v){v=+v;if(v<2)g=v?'enc':'sed';else if(v<4)l=v>2?'mucha':'poca';else if(v>4)k='estr'});
if(l!='ok')k=l;if(g!='ok')k=g;t=g!='ok'&&l!='ok'?N[g]+' + '+N[l]:N[k];if(o===false){k='off';t=N.off}
d.agua=g;d.luz=l;d.c=k;if(p!=null)d.pers=p;a.setAttribute('aria-label',t);c.dataset.k=k;c.querySelector('.bd').textContent=t}
</script>
